name: Heater
products:
  - id: yonreocijobzgyxq
    model: AFD02T-B
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: string
        name: preset_mode
        mapping:
          - dps_val: hot
            value: comfort
          - dps_val: eco
            value: eco
          - dps_val: cold
            value: away
          - dps_val: auto
            value: program
          - dps_val: boost
            value: boost
      - id: 16
        type: integer
        name: temperature
        unit: C
        range:
          min: 70
          max: 400
        mapping:
          - scale: 10
            step: 5
      - id: 24
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
      - id: 1
        type: boolean
        name: hvac_action
        mapping:
          - dps_val: true
            value: heating
          - dps_val: false
            value: idle
  - entity: number
    name: Boost time
    icon: "mdi:timer-fire"
    class: duration
    dps:
      - id: 111
        type: integer
        name: value
        unit: h
        range:
          min: 5
          max: 80
        mapping:
          - scale: 10
            step: 5
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 40
        type: boolean
        name: lock
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 27
        type: integer
        name: value
        unit: C
        range:
          min: -5
          max: 5
